<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true">
  <!-- The six cut flag designs from the papel picado over the contact form in index.html. -->
  <defs>
    <!-- Shared flag body: scalloped hem, perforation row. Six cut designs below.
         Cut-outs are masks, so the page truly shows through the holes. -->
    <path id="pic-shape" d="M-55,0 H55 V64 a11,11 0 0 1 -22,0 a11,11 0 0 1 -22,0 a11,11 0 0 1 -22,0 a11,11 0 0 1 -22,0 a11,11 0 0 1 -22,0 Z"/>
    <path id="pic-heart" d="M0,2.2 C0,0.6 1.6,-0.9 3,0.6 C4.4,-0.9 6,0.6 6,2.2 C6,4 3,6.2 3,6.2 C3,6.2 0,4 0,2.2 Z"/>
    <g id="pic-fern">
      <ellipse rx="1.7" ry="5"/>
      <ellipse cy="-1.5" rx="1.6" ry="4.6" transform="rotate(34)"/>
      <ellipse cy="-1.5" rx="1.6" ry="4.6" transform="rotate(-34)"/>
    </g>
    <g id="pic-daisy">
      <circle r="1.7"/>
      <circle cy="-4.4" r="1.5"/><circle cx="4.2" cy="-1.4" r="1.5"/><circle cx="2.6" cy="3.6" r="1.5"/><circle cx="-2.6" cy="3.6" r="1.5"/><circle cx="-4.2" cy="-1.4" r="1.5"/>
    </g>
    <g id="pic-hem">
      <circle cx="-48" cy="58.5" r="1.3"/><circle cx="-40" cy="58.5" r="1.3"/><circle cx="-32" cy="58.5" r="1.3"/><circle cx="-24" cy="58.5" r="1.3"/><circle cx="-16" cy="58.5" r="1.3"/><circle cx="-8" cy="58.5" r="1.3"/><circle cx="0" cy="58.5" r="1.3"/><circle cx="8" cy="58.5" r="1.3"/><circle cx="16" cy="58.5" r="1.3"/><circle cx="24" cy="58.5" r="1.3"/><circle cx="32" cy="58.5" r="1.3"/><circle cx="40" cy="58.5" r="1.3"/><circle cx="48" cy="58.5" r="1.3"/>
      <ellipse cx="-44" cy="69" rx="2.4" ry="4"/><ellipse cx="-22" cy="69" rx="2.4" ry="4"/><ellipse cx="0" cy="69" rx="2.4" ry="4"/><ellipse cx="22" cy="69" rx="2.4" ry="4"/><ellipse cx="44" cy="69" rx="2.4" ry="4"/>
    </g>
    <pattern id="pic-lat" x="-46" y="11" width="11" height="9.5" patternUnits="userSpaceOnUse">
      <rect width="11" height="9.5" fill="#fff"/>
      <path d="M5.5,1.2 L9.2,4.75 L5.5,8.3 L1.8,4.75 Z" fill="#000"/>
    </pattern>

    <!-- Design 1: flor con halo -->
    <mask id="pic-mask-1" maskUnits="userSpaceOnUse" x="-56" y="-2" width="112" height="82">
      <use href="#pic-shape" fill="#fff"/>
      <g fill="#000">
        <circle cx="0" cy="28" r="3.4"/>
        <circle cx="0" cy="28" r="6.8" fill="none" stroke="#000" stroke-width="1.8"/>
        <ellipse cx="0" cy="15.5" rx="3" ry="7" transform="rotate(0 0 28)"/><ellipse cx="0" cy="15.5" rx="3" ry="7" transform="rotate(45 0 28)"/><ellipse cx="0" cy="15.5" rx="3" ry="7" transform="rotate(90 0 28)"/><ellipse cx="0" cy="15.5" rx="3" ry="7" transform="rotate(135 0 28)"/><ellipse cx="0" cy="15.5" rx="3" ry="7" transform="rotate(180 0 28)"/><ellipse cx="0" cy="15.5" rx="3" ry="7" transform="rotate(225 0 28)"/><ellipse cx="0" cy="15.5" rx="3" ry="7" transform="rotate(270 0 28)"/><ellipse cx="0" cy="15.5" rx="3" ry="7" transform="rotate(315 0 28)"/>
        <circle cx="21.0" cy="28.0" r="1.3"/><circle cx="18.2" cy="38.5" r="1.3"/><circle cx="10.5" cy="46.2" r="1.3"/><circle cx="0.0" cy="49.0" r="1.3"/><circle cx="-10.5" cy="46.2" r="1.3"/><circle cx="-18.2" cy="38.5" r="1.3"/><circle cx="-21.0" cy="28.0" r="1.3"/><circle cx="-18.2" cy="17.5" r="1.3"/><circle cx="-10.5" cy="9.8" r="1.3"/><circle cx="-0.0" cy="7.0" r="1.3"/><circle cx="10.5" cy="9.8" r="1.3"/><circle cx="18.2" cy="17.5" r="1.3"/>
        <use href="#pic-fern" transform="translate(-42,14) rotate(-30)"/>
        <use href="#pic-fern" transform="translate(42,14) rotate(30)"/>
        <use href="#pic-daisy" transform="translate(-35,33)"/>
        <use href="#pic-daisy" transform="translate(35,33)"/>
        <use href="#pic-heart" transform="translate(-22,46.5)"/>
        <use href="#pic-heart" transform="translate(16,46.5)"/>
        <use href="#pic-hem"/>
      </g>
    </mask>
    <!-- Design 2: palomas (facing doves) -->
    <mask id="pic-mask-2" maskUnits="userSpaceOnUse" x="-56" y="-2" width="112" height="82">
      <use href="#pic-shape" fill="#fff"/>
      <g fill="#000">
        <g transform="translate(-17,26)"><ellipse rx="8.5" ry="4.5" transform="rotate(-12)"/><circle cx="7.5" cy="-4" r="3"/><path d="M10,-5.2 L14.8,-3.8 L10,-2.2 Z"/><ellipse cx="-1" cy="-5" rx="4.8" ry="2.3" transform="rotate(-38 -1 -5)"/><path d="M-7,1 L-15.5,7.5 L-5.5,5.5 Z"/></g>
        <g transform="translate(17,26) scale(-1,1)"><ellipse rx="8.5" ry="4.5" transform="rotate(-12)"/><circle cx="7.5" cy="-4" r="3"/><path d="M10,-5.2 L14.8,-3.8 L10,-2.2 Z"/><ellipse cx="-1" cy="-5" rx="4.8" ry="2.3" transform="rotate(-38 -1 -5)"/><path d="M-7,1 L-15.5,7.5 L-5.5,5.5 Z"/></g>
        <use href="#pic-daisy" transform="translate(0,44)"/>
        <use href="#pic-daisy" transform="translate(-40,38)"/>
        <use href="#pic-daisy" transform="translate(40,38)"/>
        <use href="#pic-heart" transform="translate(-3,8)"/>
        <use href="#pic-fern" transform="translate(-42,12) rotate(-30)"/>
        <use href="#pic-fern" transform="translate(42,12) rotate(30)"/>
        <use href="#pic-hem"/>
      </g>
    </mask>
    <!-- Design 3: sol radiante -->
    <mask id="pic-mask-3" maskUnits="userSpaceOnUse" x="-56" y="-2" width="112" height="82">
      <use href="#pic-shape" fill="#fff"/>
      <g fill="#000">
        <circle cx="0" cy="28" r="6.5"/>
        <path d="M0,10 L3.6,17.5 L-3.6,17.5 Z" transform="rotate(0 0 28)"/><path d="M0,10 L3.6,17.5 L-3.6,17.5 Z" transform="rotate(45 0 28)"/><path d="M0,10 L3.6,17.5 L-3.6,17.5 Z" transform="rotate(90 0 28)"/><path d="M0,10 L3.6,17.5 L-3.6,17.5 Z" transform="rotate(135 0 28)"/><path d="M0,10 L3.6,17.5 L-3.6,17.5 Z" transform="rotate(180 0 28)"/><path d="M0,10 L3.6,17.5 L-3.6,17.5 Z" transform="rotate(225 0 28)"/><path d="M0,10 L3.6,17.5 L-3.6,17.5 Z" transform="rotate(270 0 28)"/><path d="M0,10 L3.6,17.5 L-3.6,17.5 Z" transform="rotate(315 0 28)"/>
        <circle cx="18.9" cy="20.2" r="1.3"/><circle cx="7.8" cy="9.1" r="1.3"/><circle cx="-7.8" cy="9.1" r="1.3"/><circle cx="-18.9" cy="20.2" r="1.3"/><circle cx="-18.9" cy="35.8" r="1.3"/><circle cx="-7.8" cy="46.9" r="1.3"/><circle cx="7.8" cy="46.9" r="1.3"/><circle cx="18.9" cy="35.8" r="1.3"/>
        <use href="#pic-heart" transform="translate(-43,10)"/>
        <use href="#pic-heart" transform="translate(35,10)"/>
        <use href="#pic-daisy" transform="translate(-38,40)"/>
        <use href="#pic-daisy" transform="translate(38,40)"/>
        <use href="#pic-hem"/>
      </g>
    </mask>
    <!-- Design 4: sombrero charro -->
    <mask id="pic-mask-4" maskUnits="userSpaceOnUse" x="-56" y="-2" width="112" height="82">
      <use href="#pic-shape" fill="#fff"/>
      <g fill="#000">
        <path d="M-26,32 Q-15,28 -11,28 Q-11,15 0,15 Q11,15 11,28 Q15,28 26,32 Q13,37 0,37 Q-13,37 -26,32 Z"/>
        <circle cx="-13" cy="17" r="1.3"/><circle cx="-6.5" cy="13.5" r="1.3"/><circle cx="0" cy="12.5" r="1.3"/><circle cx="6.5" cy="13.5" r="1.3"/><circle cx="13" cy="17" r="1.3"/>
        <rect x="-2.4" y="5.6" width="4.8" height="4.8" transform="rotate(45 0 8)"/>
        <rect x="-30.4" y="5.6" width="4.8" height="4.8" transform="rotate(45 -28 8)"/>
        <rect x="25.6" y="5.6" width="4.8" height="4.8" transform="rotate(45 28 8)"/>
        <rect x="-39" y="23" width="6.5" height="6.5" transform="rotate(45 -35.75 26.25)"/>
        <rect x="32.5" y="23" width="6.5" height="6.5" transform="rotate(45 35.75 26.25)"/>
        <use href="#pic-daisy" transform="translate(-35,45)"/>
        <use href="#pic-daisy" transform="translate(35,45)"/>
        <use href="#pic-hem"/>
      </g>
    </mask>
    <!-- Design 5: rejilla (lattice) with medallion -->
    <mask id="pic-mask-5" maskUnits="userSpaceOnUse" x="-56" y="-2" width="112" height="82">
      <use href="#pic-shape" fill="#fff"/>
      <rect x="-46" y="11" width="92" height="38" fill="url(#pic-lat)"/>
      <circle cx="0" cy="28" r="13" fill="#fff"/>
      <g fill="#000">
        <circle cx="0" cy="28" r="3"/>
        <ellipse cx="0" cy="21" rx="2.2" ry="5.5" transform="rotate(0 0 28)"/><ellipse cx="0" cy="21" rx="2.2" ry="5.5" transform="rotate(60 0 28)"/><ellipse cx="0" cy="21" rx="2.2" ry="5.5" transform="rotate(120 0 28)"/><ellipse cx="0" cy="21" rx="2.2" ry="5.5" transform="rotate(180 0 28)"/><ellipse cx="0" cy="21" rx="2.2" ry="5.5" transform="rotate(240 0 28)"/><ellipse cx="0" cy="21" rx="2.2" ry="5.5" transform="rotate(300 0 28)"/>
        <use href="#pic-hem"/>
      </g>
    </mask>
    <!-- Design 6: calavera festiva -->
    <mask id="pic-mask-6" maskUnits="userSpaceOnUse" x="-56" y="-2" width="112" height="82">
      <use href="#pic-shape" fill="#fff"/>
      <g fill="#000">
        <circle cx="0" cy="22" r="12"/>
        <rect x="-7" y="27" width="14" height="12" rx="4.5"/>
      </g>
      <g fill="#fff">
        <circle cx="-5" cy="21" r="3.3"/>
        <circle cx="5" cy="21" r="3.3"/>
        <path d="M0,26 L2.3,30.2 L-2.3,30.2 Z"/>
        <rect x="-6" y="32.6" width="12" height="1.4"/>
        <rect x="-3.6" y="30.9" width="1.2" height="4.8"/>
        <rect x="-0.6" y="30.9" width="1.2" height="4.8"/>
        <rect x="2.4" y="30.9" width="1.2" height="4.8"/>
      </g>
      <g fill="#000">
        <circle cx="-5" cy="21" r="1.2"/>
        <circle cx="5" cy="21" r="1.2"/>
        <use href="#pic-daisy" transform="translate(-37,16)"/>
        <use href="#pic-daisy" transform="translate(37,16)"/>
        <use href="#pic-fern" transform="translate(-40,44) rotate(-28)"/>
        <use href="#pic-fern" transform="translate(40,44) rotate(28)"/>
        <use href="#pic-heart" transform="translate(-20,46)"/>
        <use href="#pic-heart" transform="translate(14,46)"/>
        <use href="#pic-hem"/>
      </g>
    </mask>

    <g id="pic-flag-1" mask="url(#pic-mask-1)"><use href="#pic-shape"/><rect x="-55" y="0" width="110" height="5.5" fill="#2C1B28" opacity="0.18"/></g>
    <g id="pic-flag-2" mask="url(#pic-mask-2)"><use href="#pic-shape"/><rect x="-55" y="0" width="110" height="5.5" fill="#2C1B28" opacity="0.18"/></g>
    <g id="pic-flag-3" mask="url(#pic-mask-3)"><use href="#pic-shape"/><rect x="-55" y="0" width="110" height="5.5" fill="#2C1B28" opacity="0.18"/></g>
    <g id="pic-flag-4" mask="url(#pic-mask-4)"><use href="#pic-shape"/><rect x="-55" y="0" width="110" height="5.5" fill="#2C1B28" opacity="0.18"/></g>
    <g id="pic-flag-5" mask="url(#pic-mask-5)"><use href="#pic-shape"/><rect x="-55" y="0" width="110" height="5.5" fill="#2C1B28" opacity="0.18"/></g>
    <g id="pic-flag-6" mask="url(#pic-mask-6)"><use href="#pic-shape"/><rect x="-55" y="0" width="110" height="5.5" fill="#2C1B28" opacity="0.18"/></g>
  </defs>
</svg>
