<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0514" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BFMH Team" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Team · Ballet Folklórico Mi Herencia</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/team/icons/icon-180.png" />
  <link rel="manifest" href="/team/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/team/team.css" />
</head>
<body>
  <header class="tm-header">
    <a class="tm-brand" href="/team/" aria-label="Ballet Folklórico Mi Herencia — Team">
      <img class="tm-logo" src="/images/optimized/logo-dancers-color.webp" alt="" />
      <span class="tm-wordmark notranslate" translate="no">
        <span class="tm-wm-1">Ballet Folklórico</span>
        <span class="tm-wm-2">Mi Herencia</span>
        <span class="tm-wm-short">BFMH</span>
      </span>
      <span class="tm-brand-div"></span>
      <span class="tm-brand-role" id="brand-role">Team</span>
    </a>
    <div class="tm-header-right" id="header-right"></div>
  </header>
  <main class="tm-main" id="app" aria-live="polite">
    <div class="tm-boot" role="status" aria-label="Loading">
      <svg class="tm-twirl" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <circle class="tw tw-3" cx="50" cy="50" r="42" />
        <circle class="tw tw-2" cx="50" cy="50" r="31" />
        <circle class="tw tw-1" cx="50" cy="50" r="20" />
        <circle class="tw-core" cx="50" cy="50" r="6" />
      </svg>
      <p class="tm-boot-text">Loading…</p>
    </div>
  </main>
  <nav class="tm-tabs" id="tabs" aria-label="Sections" hidden></nav>
  <div id="fab-root"></div>
  <div id="toast" class="tm-toast" role="status" hidden></div>
  <div id="modal-root"></div>
  <script src="/team/team.js"></script>
</body>
</html>
